<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Security Portfolio</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --container-bg: #222222;
            --text-color: #ffffff;
            --sub-text: #cccccc;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        /* The light mode color palette */
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #0f172a;
            --sub-text: #4b5563;
            --shadow: rgba(0, 0, 0, 0.05);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 50px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            animation: fadeUp 1s ease-out forwards;
            transition: background-color 0.3s ease;
        }

        h1 {
            color: #00ff66;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            margin-bottom: 10px;
        }

        h2 {
            color: #00bcff;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        p {
            color: var(--sub-text);
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Interactive Buttons */
        .btn-link {
            display: inline-block;
            background-color: #ffcc00;
            color: #1a1a1a;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-link:hover {
            transform: scale(1.05);
        }

        .btn-danger {
            background-color: #ff3333;
            color: white;
        }

        .btn-danger:hover {
            background-color: #cc0000;
        }

        img {
            margin-top: 20px;
            margin-bottom: 20px;
            border: 2px solid #00ff66;
            border-radius: 10px;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Interactive Theme Switcher Button -->
        <button class="btn-link" id="themeToggle">Toggle Light Mode</button>

        <h1>Welcome to My Website!</h1>
        <h2>Phase 2: Interactive Controls</h2>
        
        <img src="https://icons8.com" alt="Secure Padlock Icon">
        
        <br>
        <a class="btn-link" href="logs.html">Access Secret Logs</a>
        
        <!-- Interactive Security Alert Button -->
        <button class="btn-link btn-danger" id="alertBtn">Trigger Breach Alert</button>
        
        <p>Check out my training ground at <a class="btn-link" href="https://fuq.com" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
    </div>
    
    <script>
                // 1. Upgraded Theme Toggle Logic with Memory
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            themeToggle.textContent = 'Toggle Dark Mode';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            
            if (currentTheme === 'light') {
                document.body.removeAttribute('data-theme');
                themeToggle.textContent = 'Toggle Light Mode';
                localStorage.setItem('theme', 'dark'); // Save dark choice to vault
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeToggle.textContent = 'Toggle Dark Mode';
                localStorage.setItem('theme', 'light'); // Save light choice to vault
            }
        });

    </script>

</body>
</html>
