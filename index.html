<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
    <style>
        /* This is the CSS section */
        body {
            background-color: #1a1a1a; /* Changes background to dark grey */
            color: #ffffff;            /* Changes main text to white */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #00ff66;            /* Changes the main title to hacker green */
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3); /* Adds a slight glow */
        }
        h2 {
            color: #00bcff;            /* A cool blue color for the sub-heading */
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
        p {
            color: #cccccc;            /* Makes the paragraph text slightly softer grey */
            font-size: 1.2rem;
        }
        a {
            color: #ffcc00;            /* Makes the link bright yellow */
            font-weight: bold;
        }
        img {
            margin-top: 20px;
            border: 2px solid #00ff66; /* Adds a green border around the image */
            border-radius: 10px;       /* Rounds the corners of the image */
        }
.container {
    max-width: 800px;
    margin: 0 auto;
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    animation: fadeUp 1s ease-out forwards;
}
        @keyframes fadeUp {
    0% {
        opacity: 0;             /* Completely invisible */
        transform: translateY(20px); /* Pushed down slightly */
    }
    100% {
        opacity: 1;             /* Fully visible */
        transform: translateY(0);    /* Snapped back to its perfect position */
    }
}
    </style>
</head>
<body>
    <h1>Welcome to My Website!</h1>
    <h2>Phase 1: Foundation Building</h2>
    <img src="https://icons8.com" alt="Secure Padlock Icon">
    <a class="btn-link" href="logs.html">Access Secret Logs</a>
    <p>Check out my training ground at <a href="https://github.com" target="_blank"rel="noopener noreferrer">GitHub</a>.</p>
</body>
</html>
